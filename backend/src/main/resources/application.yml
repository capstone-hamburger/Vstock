spring:
  application:
    name: vstock
  profiles:
    active: local

  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

vstock:
  websocket:
    # 소켓 핸드셰이크를 허용할 프론트엔드 Origin. 프론트 스택·포트 확정 후 조정한다.
    allowed-origins: http://localhost:3000,http://localhost:5173
